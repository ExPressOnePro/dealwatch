; Настройки DealWatch: сбор и ИИ-разбор идут в очереди, но карточки объявлений
; и архив страниц бывают тяжёлыми, поэтому лимиты выше дефолтных.
memory_limit = 512M
max_execution_time = 120
upload_max_filesize = 20M
post_max_size = 20M
expose_php = Off

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
