# Локальная разработка: код монтируется томом, ассеты собирает vite.
# Продакшен — docker-compose.prod.yml (код и сборка внутри образа).
name: dealwatch

services:
    app:
        build:
            context: .
            target: dev
        user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
        volumes:
            - .:/var/www/html
        environment:
            # APP_ENV намеренно не задаём: он приезжает из .env, иначе перебивает
            # тестовое окружение при `docker compose run app php vendor/bin/phpunit`.
            DEALWATCH_OPTIMIZE: "false"
            RUN_MIGRATIONS: "true"

    web:
        image: nginx:1.27-alpine
        ports:
            - "${DEALWATCH_PORT:-8000}:80"
        volumes:
            - .:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app

    queue:
        build:
            context: .
            target: dev
        user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
        volumes:
            - .:/var/www/html
        environment:
            DEALWATCH_OPTIMIZE: "false"
        # Сбор, ИИ-разбор и архивация объявлений выполняются здесь.
        command: php artisan queue:work --tries=1 --timeout=900 --sleep=1
        depends_on:
            - app

    scheduler:
        build:
            context: .
            target: dev
        user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
        volumes:
            - .:/var/www/html
        environment:
            DEALWATCH_OPTIMIZE: "false"
        # Сбор каждые 3 минуты и проверка снятых объявлений — по желанию:
        # docker compose --profile scheduler up -d
        profiles: ["scheduler"]
        command: php artisan schedule:work
        depends_on:
            - app

    vite:
        image: node:22-alpine
        # Тот же пользователь, что и на хосте: иначе node_modules и временные
        # файлы vite достаются root, и сборка на хосте падает с EACCES.
        user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
        ports:
            - "5188:5188"
        command: sh -c "npm install --no-audit --no-fund && npm run dev:local -- --host 0.0.0.0"
